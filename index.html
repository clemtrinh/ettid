<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Participant ID Generator</title>
<style>
  :root{
    --bg:#f4f7fa; --card:#ffffff; --ink:#1c2b36; --muted:#5a6b78;
    --accent:#1b6ca8; --accent-ink:#ffffff; --line:#dbe4ea;
    --code-bg:#eaf3fb; --warn-bg:#fdf3e7; --warn-ink:#8a5a1b; --warn-line:#f0cfa0;
    --ok:#2e7d32;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#0f1720; --card:#17222c; --ink:#e7eef3; --muted:#9fb0bc;
      --accent:#4aa3d8; --accent-ink:#06121b; --line:#26323d;
      --code-bg:#10202c; --warn-bg:#2a2010; --warn-ink:#e7c68a; --warn-line:#5a4420;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1720; --card:#17222c; --ink:#e7eef3; --muted:#9fb0bc;
    --accent:#4aa3d8; --accent-ink:#06121b; --line:#26323d;
    --code-bg:#10202c; --warn-bg:#2a2010; --warn-ink:#e7c68a; --warn-line:#5a4420;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.5; padding:16px;
  }
  .wrap{max-width:560px; margin:24px auto}
  h1{font-size:1.35rem; margin:0 0 4px}
  .sub{color:var(--muted); font-size:.92rem; margin:0 0 20px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px}
  label{display:block; font-weight:600; font-size:.9rem; margin-bottom:6px}
  input[type=text]{
    width:100%; font-size:1.15rem; padding:12px 14px; border:1px solid var(--line);
    border-radius:10px; background:var(--bg); color:var(--ink);
  }
  input:focus{outline:2px solid var(--accent); outline-offset:1px}
  .norm{color:var(--muted); font-size:.82rem; margin-top:8px; min-height:1.2em}
  .result{
    margin-top:18px; text-align:center; background:var(--code-bg);
    border:1px solid var(--line); border-radius:12px; padding:18px;
  }
  .result .lbl{font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:2rem; font-weight:700; letter-spacing:.05em; margin:6px 0 12px; word-break:break-all}
  button{
    font-size:.95rem; font-weight:600; padding:10px 18px; border:none; border-radius:9px;
    background:var(--accent); color:var(--accent-ink); cursor:pointer;
  }
  button:active{transform:translateY(1px)}
  .copied{color:var(--ok); font-size:.85rem; margin-left:10px}
  .warn{background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn-ink);
        border-radius:12px; padding:14px 16px; font-size:.86rem}
  .warn b{color:var(--warn-ink)}
  ul{margin:8px 0 0; padding-left:20px}
  li{margin:3px 0}
  code{font-family:ui-monospace,Menlo,Consolas,monospace; background:var(--code-bg); padding:1px 5px; border-radius:4px; font-size:.85em}
</style>
</head>
<body>
<div class="wrap">
  <h1>Participant ID Generator</h1>
  <p class="sub">RWH Neonatal ETT Depth Study</p>

  <div class="card">
    <label for="name">Participant name</label>
    <input id="name" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="e.g. Jane Smith">
    <div class="norm" id="norm"></div>

    <div class="result">
      <div class="lbl">Unique participant ID</div>
      <div class="code" id="code">&mdash;</div>
      <button id="copy">Copy ID</button><span class="copied" id="copied"></span>
    </div>
  </div>

  <div class="warn">
    <ul>
      <li>Type the name the <em>same way</em> each round.</li>
      <li>Only the generated ID is entered into REDCap. The name is never stored here or in REDCap.</li>
    </ul>
  </div>
</div>

<script>
  // ─────────────────────────────────────────────────────────────
  //  EDIT THIS LINE ONCE: replace with your team's secret phrase.
  const PROJECT_KEY = "neonatal_ETT_womens";
  // ─────────────────────────────────────────────────────────────

  const enc = new TextEncoder();
  const nameEl = document.getElementById('name');
  const normEl = document.getElementById('norm');
  const codeEl = document.getElementById('code');
  const copiedEl = document.getElementById('copied');

  // Standardise: lowercase, strip accents, remove everything but a-z0-9
  function normalize(s){
    return (s||"").toLowerCase().normalize('NFKD')
      .replace(/[̀-ͯ]/g,'')
      .replace(/[^a-z0-9]/g,'');
  }

  let keyPromise = crypto.subtle.importKey(
    'raw', enc.encode(PROJECT_KEY), {name:'HMAC', hash:'SHA-256'}, false, ['sign']
  );

  async function generate(){
    const raw = nameEl.value;
    const norm = normalize(raw);
    copiedEl.textContent = '';
    if(!norm){ normEl.textContent=''; codeEl.textContent='—'; return; }
    normEl.textContent = 'Standardised input: ' + norm;
    const key = await keyPromise;
    const sig = await crypto.subtle.sign('HMAC', key, enc.encode(norm));
    const bytes = new Uint8Array(sig);
    const hex = [...bytes].map(b=>b.toString(16).padStart(2,'0')).join('');
    codeEl.textContent = 'ETT-' + hex.slice(0,8).toUpperCase();
  }

  nameEl.addEventListener('input', generate);
  document.getElementById('copy').addEventListener('click', async ()=>{
    const t = codeEl.textContent;
    if(t && t!=='—'){
      try{ await navigator.clipboard.writeText(t); copiedEl.textContent='Copied'; }
      catch(e){ copiedEl.textContent='Select & copy manually'; }
    }
  });
</script>
</body>
</html>
